name: Archive contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the Python runtime
        run: |
          python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11 or later is required"'
          mkdir -p .build/validation
          git rev-parse HEAD > .build/validation/revision.txt
      - name: Validate the entire source archive
        run: |
          set -euo pipefail
          python3 tools/archive.py validate | tee .build/validation/archive-counts.json
      - name: Run contract regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee .build/validation/tests.txt
      - name: Verify deterministic build-only projections without changing source
        run: |
          set -euo pipefail
          python3 tools/archive.py derive
          cp .build/derived/manifest.json .build/validation/derived-manifest.json
          cp .build/derived/navigation.json .build/validation/derived-navigation.json
          python3 tools/archive.py derive
          cmp .build/derived/manifest.json .build/validation/derived-manifest.json
          cmp .build/derived/navigation.json .build/validation/derived-navigation.json
          git diff --exit-code
          test -z "$(git ls-files -- manifest.json navigation.json)"
      - name: Verify the root-domain display export
        run: |
          set -euo pipefail
          python3 tools/archive.py export --output .build/root --base /
          cp .build/root/manifest.json .build/validation/root-export-manifest.json
      - name: Verify the GitHub Pages project-path display export
        run: |
          set -euo pipefail
          python3 tools/archive.py export --output .build/project --base /berean-voice/
          cp .build/project/manifest.json .build/validation/project-export-manifest.json
      - name: Record the validation summary
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('.')
          counts = json.loads((root / '.build/validation/archive-counts.json').read_text())
          catalogue = json.loads((root / 'catalogue.json').read_text())
          summary = {
              'source_counts': counts,
              'registry_counts': {kind: len(catalogue[kind]) for kind in ('issues', 'categories', 'topics', 'series')},
              'tested_base_paths': ['/', '/berean-voice/'],
              'source_changed_by_ci': False,
              'website_deployed': False,
          }
          (root / '.build/validation/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Archive contract passed\n\n')
              output.write(f"Validated {counts['articles']} articles, {counts['images']} images, {counts['issues']} issues, and {counts['skipped']} skipped audit records.\n\n")
              output.write('Regression tests, deterministic build outputs, and both display-only export base paths passed. No source files were committed and no website was deployed.\n')
          PY
      # Notify only after the trusted main revision passes every archive check.
      - name: Check Remnant publishing token availability
        if: github.ref == 'refs/heads/main'
        id: remnant_config
        env:
          REMNANT_DISPATCH_TOKEN: ${{ secrets.REMNANT_DISPATCH_TOKEN }}
        run: |
          if [ -n "$REMNANT_DISPATCH_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Remnant publishing skipped: REMNANT_DISPATCH_TOKEN is not configured.'
            echo 'Remnant publishing skipped: REMNANT_DISPATCH_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restore the last accepted Remnant display notification
        if: github.ref == 'refs/heads/main' && steps.remnant_config.outputs.configured == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/remnant-notified/state.json
          key: remnant-notify-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: remnant-notify-v1-
      - name: Export a fresh website-facing publication
        if: github.ref == 'refs/heads/main' && steps.remnant_config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python3 tools/archive.py export --output .build/remnant-export --base /
      - name: Notify Remnant from the durable publishing path
        if: github.ref == 'refs/heads/main' && steps.remnant_config.outputs.configured == 'true'
        id: remnant_notify
        env:
          REMNANT_DISPATCH_TOKEN: ${{ secrets.REMNANT_DISPATCH_TOKEN }}
        run: >-
          python3 .github/remnant/dispatch.py notify
          --repository trueChristian/berean-voice
          --checkout . --export .build/remnant-export
          --state .build/remnant-notified/state.json
      - name: Remember only a successfully accepted notification
        if: github.ref == 'refs/heads/main' && steps.remnant_config.outputs.configured == 'true' && steps.remnant_notify.outputs.sent == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/remnant-notified/state.json
          key: remnant-notify-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload validation evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-contract-validation
          path: .build/validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
