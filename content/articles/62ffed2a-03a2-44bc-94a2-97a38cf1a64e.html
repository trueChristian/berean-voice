<p><em>This sums up the spirit of Phil. 2:5-8:</em></p>
<p class="poem">Because we children of Adam want to be great<br><strong>–HE BECAME SMALL.</strong><br>Because we are always seeking to climb higher<br><strong>–HE STEPPED DOWN.</strong><br>Because we will not stoop<br><strong>–HE HUMBLED HIMSELF.</strong><br>Because we want to rule<br><strong>–HE CAME TO SERVE.</strong></p>
