<article data-article-id="6fb626a6-774a-43be-8268-918f4adcaffc">
  <p class="poem">You say you are free;<br>Yet you are bound<br>To pleasure,<br>To hate,<br>To the opinions of your peers.</p>
  <p class="poem">I say I am bound;<br>Yet I am free<br>For service,<br>For love,<br>For submission to the will of my God.</p>
  <p class="poem">And in this my bound liberty,<br>I am far more free<br>Than you are<br>In your liberated bondage.</p>
</article>
