<article data-article-id="894895bc-1b0b-4f33-a9b9-b7242c114387">
  <p class="poem">I never cut my neighbor’s throat,<br>
  My neighbor’s gold I never stole;<br>
  I never spoiled his house and land;<br>
  But God have mercy on my soul!</p>

  <p class="poem">For I am haunted night and day<br>
  By all the deeds I have not done;<br>
  Oh, unattempted loveliness!<br>
  Oh, costly valor never won!</p>
</article>
