  <figure><img src="/images/articles/7fe63551-500f-4963-8b75-e17ae8cfd46a-2.jpg" alt="A man asleep against a stone column"></figure>
  <p class="poem"><strong>Could a mariner sit idle if he heard the drowning cry?<br>
  Could a doctor sit in comfort and let his patients die?<br>
  Could a fireman sit idle, let men burn and give no hand?<br>
  Could you sit at ease in Zion with the world around you damned?</strong></p>
