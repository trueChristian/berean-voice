<article data-article-id="e8debe1a-1867-47a1-a45f-21595bd4a4e1">
  <p class="poem">The first is to conquer the world<br>
  through force and coercion<br>
  and rule the world as a tyrant.</p>
  <p class="poem">The other is to create a world so small<br>
  that you remove all competition.</p>
  <p class="poem">In the end, both are just as destructive<br>
  to the people around them.</p>
</article>
