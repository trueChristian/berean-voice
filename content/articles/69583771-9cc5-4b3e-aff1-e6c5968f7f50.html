  <figure><img src="/images/articles/69583771-9cc5-4b3e-aff1-e6c5968f7f50-1.jpg" alt="A lightning storm and a mountain above a lake accompany the printed poem My Name is I AM."></figure>
  <p class="poem">When you live in the past,<br>with its mistakes and regrets,<br>it is hard. I am not there.<br>My name is not I Was.</p>
  <p class="poem">When you live in the future,<br>with its problems and fears,<br>it is hard. I am not there.<br>My name is not I Will Be.</p>
  <p class="poem">When you live in this moment,<br>it is not hard. I am here.<br><strong>My name is I AM.</strong></p>
